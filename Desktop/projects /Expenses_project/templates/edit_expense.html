{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
<div class="card mx-auto p-3" style="max-width: 400px; background: rgba(255,255,255,0.9);">
    <h3>Edit Expense</h3>
    <form method="POST">
        <input type="text" name="expense" class="form-control mb-2" value="{{ expense.expense }}" required>
        <input type="number" step="0.01" name="amount" class="form-control mb-2" value="{{ expense.amount }}" required>
        <input type="text" name="category" class="form-control mb-2" value="{{ expense.category }}" required>
        <input type="date" name="date" class="form-control mb-2" value="{{ expense.date }}">
        <button class="btn btn-success w-100">Update</button>
    </form>
    <a href="{{ url_for('dashboard', username=username) }}" class="btn btn-secondary mt-2 w-100">Cancel</a>
</div>
{% endblock %}
